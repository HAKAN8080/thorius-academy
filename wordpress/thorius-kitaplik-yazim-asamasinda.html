  @keyframes th2k-bg-breathe {

  .th2-kitaplik-overlay {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(5,11,26,0.72) 0%, rgba(5,11,26,0.55) 40%, rgba(5,11,26,0.82) 100%),
      radial-gradient(ellipse at center, rgba(10,24,48,0.35) 0%, rgba(5,11,26,0.75) 70%);
  }

  .th2-kitaplik-inner {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem clamp(1.25rem, 4vw, 3rem);
    max-width: 42rem;
  }

  .th2-kitaplik-pencil-wrap {
    position: relative;
    width: 5.5rem;
    height: 5.5rem;
    margin: 0 auto 1.75rem;
  }
  .th2-kitaplik-pencil-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(232,199,102,0.35);
    animation: th2k-ring-pulse 2.4s ease-out infinite;
  }
  @keyframes th2k-ring-pulse {
    0%   { transform: scale(0.85); opacity: 0.9; }
    70%  { transform: scale(1.35); opacity: 0; }
    100% { transform: scale(1.35); opacity: 0; }
  }
  .th2-kitaplik-pencil {
    position: absolute;
    inset: 0.65rem;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: linear-gradient(145deg, rgba(212,175,55,0.22), rgba(212,175,55,0.08));
    border: 1px solid rgba(232,199,102,0.45);
    backdrop-filter: blur(8px);
    animation: th2k-pencil-write 2.8s ease-in-out infinite;
  }
  @keyframes th2k-pencil-write {
    0%, 100% { transform: rotate(-8deg) translateY(0); }
    25%      { transform: rotate(4deg) translateY(-3px); }
    50%      { transform: rotate(-4deg) translateY(2px); }
    75%      { transform: rotate(6deg) translateY(-2px); }
  }
  .th2-kitaplik-pencil svg {
    width: 2.25rem;
    height: 2.25rem;
    stroke: var(--gold-light);
    fill: none;
    stroke-width: 1.75;
    filter: drop-shadow(0 0 8px rgba(232,199,102,0.45));
  }

  .th2-kitaplik-line {
    width: min(280px, 70vw);
    height: 3px;
    margin: 0 auto 1.75rem;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    overflow: hidden;
    position: relative;
  }
  .th2-kitaplik-line::after {
    content: "";
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 40%;
    background: linear-gradient(90deg, transparent, var(--gold-light), transparent);
    animation: th2k-line-draw 2.8s ease-in-out infinite;
  }
  @keyframes th2k-line-draw {
    0%   { left: -40%; }
    100% { left: 100%; }
  }

  .th2-kitaplik h1 {
    margin: 0;
    font-family: var(--font-display);
    font-size: clamp(1.75rem, 5vw, 2.75rem);
    font-weight: 700;
    letter-spacing: 0.28em;
    color: #ffffff !important;
    text-shadow: 0 2px 24px rgba(0,0,0,0.45);
  }
  .th2-kitaplik h1 span {
    display: block;
    margin-top: 0.35rem;
    font-size: 0.42em;
    letter-spacing: 0.38em;
    color: var(--gold-light) !important;
    font-weight: 600;
  }

  .th2-kitaplik p {
    margin: 1.25rem auto 0;
    max-width: 32rem;
    font-size: 1.05rem;
    line-height: 1.7;
    color: #dce5f1 !important;
  }

  .th2-kitaplik-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 2rem;
